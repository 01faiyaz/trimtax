# Render reads this to set up the API. In Render: New > Blueprint, pick this repo.
# The three secrets are left blank on purpose; paste them into the dashboard when asked.
services:
  - type: web
    name: trimtax-api
    runtime: python
    plan: free # free sleeps after 15 minutes idle and takes about a minute to wake; starter doesn't sleep
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS # the Vercel address, like https://trimtax.vercel.app
        sync: false
