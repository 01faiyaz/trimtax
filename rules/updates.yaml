- id: upd_003
  year: 2026
  rule_id: fed_1099_nec_threshold
  field: threshold_cents
  from: 60000
  to: 200000
  figure: $2,000
  quote: Section 6041(a) is amended by striking “$600” and inserting “$2,000”.
  reason: The threshold rises to $2,000 for payments made after December 31, 2025, which covers 2026,
    and section 6041A(a)(2) for contractor pay now follows the section 6041(a) amount.
