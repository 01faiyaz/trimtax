# Rule update log for TrimTax.
#
# Each entry is a rule change the AI proposed (propose_rule_update) from a passage of
# official text, with the exact sentence it relied on. A person then approves or rejects it.
# Written by api/scripts/propose_rule_update.py and api/scripts/review_rule_update.py.
# Don't edit by hand.
#
# outcome: "changed" = the value in rules/<year>.yaml moved and its version went up;
#          "already_matches" = the file already had this value, so only the approval is recorded.

updates:
- id: upd_001
  year: 2026
  rule_id: fed_section_179
  field: limit_cents
  from: 250000000
  to: 256000000
  figure: $2,560,000
  quote: For taxable years beginning in 2026, under § 179(b)(1), the aggregate cost of any § 179 property
    that a taxpayer elects to treat as an expense cannot exceed $2,560,000
  reason: Sets the federal section 179 expensing limit to $2,560,000 for 2026.
  source:
    cite: Rev. Proc. 2025-32 sec. 4.24
    url: https://www.irs.gov/pub/irs-drop/rp-25-32.pdf
    file: rules/sources/rev_proc_2025_32.txt
  base_version: '2025.1'
  proposed_by: propose_rule_update.v2 on claude-sonnet-5-5
  proposed_on: 2026-11-05
  status: approved
  decided_by: Faiyaz Mashrafi
  decided_on: 2026-11-05
  outcome: already_matches
  ruleset_version: '2026.1'
- id: upd_002
  year: 2026
  rule_id: fed_section_179
  field: phaseout_start_cents
  from: 400000000
  to: 409000000
  figure: $4,090,000
  quote: Under § 179(b)(2), the $2,560,000 limitation under § 179(b)(1) is reduced (but not below zero)
